<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urban Links</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14181A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Urban Links">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181A; --ink2:#5A6360; --ink3:#8B948F;
  --paper:#E9ECE8; --card:#FFFFFF; --line:#D6DBD6;
  --gold:#B8820A; --gold-soft:#FBF0D6;
  --clay:#A93221; --clay-soft:#F8E4E0;
  --sea:#0E6B63; --sea-soft:#DDEBE9;
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45;
  padding-bottom:calc(78px + var(--safe-b));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-family:"Archivo",system-ui,sans-serif;font-weight:700;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.num{font-family:"Archivo",system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.wrap{padding:0 16px;max-width:640px;margin:0 auto}
.hidden{display:none !important}

/* header */
.top{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 0 18px;border-radius:0 0 22px 22px}
.top .eyebrow{color:#8C9A96}
.top h1{font-size:22px;margin-top:2px}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

/* fortnight pulse: the signature */
.pulse{margin-top:16px}
.pulse-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pulse-head .lbl{font-size:12px;color:#9AA7A3}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;align-items:end;height:52px}
.bar{position:relative;background:rgba(255,255,255,.10);border-radius:3px;height:100%;display:flex;align-items:flex-end;overflow:hidden}
.bar i{display:block;width:100%;background:var(--gold);border-radius:3px;min-height:2px}
.bar.today{outline:1.5px solid #fff;outline-offset:1px}
.bar.future i{background:rgba(255,255,255,.18)}
.pulse-days{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:5px}
.pulse-days span{font-size:8.5px;text-align:center;color:#7D8B87;font-variant-numeric:tabular-nums}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tile{background:var(--card);border-radius:var(--r);padding:12px 13px;border:1px solid var(--line)}
.tile.wide{grid-column:1/-1}
.tile .v{font-size:26px;margin-top:3px;display:block}
.tile.owe{background:var(--clay-soft);border-color:#EFCFC8}
.tile.owe .v{color:var(--clay)}
.tile.got{background:var(--gold-soft);border-color:#EDDCB4}
.tile.got .v{color:var(--gold)}

/* sections */
section{margin-top:22px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.link{color:var(--sea);font-size:13px;font-weight:600}

/* rows */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 13px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:#F4F6F3}
.row .main{flex:1;min-width:0}
.row .t1{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-size:16px;text-align:right;white-space:nowrap}
.amt.due{color:var(--clay)}
.amt.ok{color:var(--sea)}
.avatar{width:34px;height:34px;border-radius:10px;background:var(--sea-soft);color:var(--sea);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.avatar.due{background:var(--clay-soft);color:var(--clay)}
.tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--sea-soft);color:var(--sea)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.clay{background:var(--clay-soft);color:var(--clay)}
.date-head{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:12px 2px 6px}

/* progress */
.prog{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--sea);border-radius:3px}

/* empty */
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--ink2);font-size:14px}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:3px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:12px 16px;font-weight:600;font-size:14.5px;background:var(--ink);color:#fff;width:100%}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sea{background:var(--sea)}
.btn.danger{background:var(--card);color:var(--clay);border:1px solid #EFCFC8}
.btn:active{opacity:.85}
.btn-row{display:flex;gap:9px;margin-top:12px}

/* fab */
.fab{position:fixed;right:16px;bottom:calc(84px + var(--safe-b));background:var(--gold);color:#fff;border-radius:15px;padding:14px 18px;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(20,24,26,.22);z-index:40;display:flex;align-items:center;gap:8px}
.fab:active{transform:translateY(1px)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:var(--safe-b);z-index:50}
.tab{padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10.5px;font-weight:600;letter-spacing:.02em}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,24,26,.45);z-index:60;opacity:0;transition:opacity .18s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.3,1);padding-bottom:calc(20px + var(--safe-b))}
.sheet.show{transform:translateY(0)}
.sheet-head{position:sticky;top:0;background:var(--paper);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:2}
.sheet-head h2{font-size:17px}
.x{font-size:14px;font-weight:600;color:var(--ink2);padding:6px 4px}
.sheet-body{padding:14px 16px 0}
.grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}

/* form */
label.f{display:block;margin-bottom:12px}
label.f .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:5px;display:block}
.f input,.f select,.f textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:16px}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--sea);outline-offset:-1px;border-color:transparent}
.f textarea{min-height:66px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px}
.seg button{padding:9px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-ms-overflow-style:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:16px;margin-bottom:12px}

/* client detail */
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero .big{font-size:34px;display:block;margin-top:2px}
.hero .big.due{color:var(--clay)}
.hero .big.ok{color:var(--sea)}
.mini{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.mini div{flex:1}
.mini .v{font-size:16px;display:block;margin-top:1px}
.note{font-size:12.5px;color:var(--ink2);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));background:var(--ink);color:#fff;padding:10px 16px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div id="app"></div>

<button class="fab hidden" id="fab" onclick="openTrip()">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Trip
</button>

<nav class="tabs">
  <button class="tab" data-tab="today" onclick="go('today')">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Today</button>
  <button class="tab" data-tab="trips" onclick="go('trips')">
    <svg viewBox="0 0 24 24"><path d="M5 17h14"/><path d="M6 17l1.5-6h9L18 17"/><circle cx="8" cy="19" r="1.6"/><circle cx="16" cy="19" r="1.6"/><path d="M9 11V7h6v4"/></svg>Trips</button>
  <button class="tab" data-tab="clients" onclick="go('clients')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>Clients</button>
  <button class="tab" data-tab="more" onclick="go('more')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="18" r="1.4"/></svg>More</button>
</nav>

<div class="scrim hidden" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grip"></div>
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" onclick="closeSheet()">Close</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- storage ---------- */
const KEY = 'urbanlinks.v1';
const DAY = 86400000;

function blank(){
  const d = new Date(); d.setHours(0,0,0,0);
  const back = (d.getDay() + 6) % 7;            // most recent Monday
  return { settings:{
             business:'URBANLINKS UBER & HIRE TRANSPORT',
             phone:'+675 7858 2833',
             email:'urbanlinks.uberhire@gmail.com',
             ipa:'6-149030735',
             address:'PO Box 2111, Port Moresby, NCD, PNG',
             anchor: iso(new Date(d - back*DAY)) },
           clients:[], trips:[], payments:[] };
}
let db;
try { db = JSON.parse(localStorage.getItem(KEY)) || blank(); } catch(e){ db = blank(); }
db.settings = Object.assign(blank().settings, db.settings || {});
db.clients ||= []; db.trips ||= []; db.payments ||= [];
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Storage is full'); } }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- helpers ---------- */
function iso(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
const today = () => iso(new Date());
const dt = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
function K(n){ n = Math.round((Number(n)||0)*100)/100;
  return 'K' + n.toLocaleString('en-AU',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function Kshort(n){ n = Math.round(Number(n)||0);
  return 'K' + n.toLocaleString('en-AU'); }
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dayLabel(s){
  if(s===today()) return 'Today';
  if(s===iso(new Date(Date.now()-DAY))) return 'Yesterday';
  return dt(s).toLocaleDateString('en-AU',{weekday:'short', day:'numeric', month:'short'});
}
const shortDate = s => dt(s).toLocaleDateString('en-AU',{day:'numeric', month:'short'});
function initials(n){ return (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

/* fortnight window built off the anchor Monday */
function fortnight(dateStr){
  const a = dt(db.settings.anchor || today()), d = dt(dateStr || today());
  const idx = Math.floor((d - a) / (14*DAY));
  const start = new Date(a.getTime() + idx*14*DAY);
  const end = new Date(start.getTime() + 13*DAY);
  return { start: iso(start), end: iso(end), idx };
}
const inRange = (s,a,b) => s>=a && s<=b;
function rangeLabel(f){
  const o = {day:'numeric', month:'short'};
  return dt(f.start).toLocaleDateString('en-AU',o) + ' to ' + dt(f.end).toLocaleDateString('en-AU',o);
}

/* ---------- money model ---------- */
const client = id => db.clients.find(c=>c.id===id);
const tripsOf = id => db.trips.filter(t=>t.clientId===id);
const paysOf  = id => db.payments.filter(p=>p.clientId===id);
const sum = (a,f) => a.reduce((n,x)=>n+(Number(f(x))||0),0);
function balance(id){
  return sum(tripsOf(id).filter(t=>!t.settled), t=>t.fare) - sum(paysOf(id), p=>p.amount);
}
const totalOwing = () => db.clients.reduce((n,c)=>n+Math.max(0,balance(c.id)),0);
function receivedIn(a,b){
  return sum(db.trips.filter(t=>t.settled && inRange(t.date,a,b)), t=>t.fare)
       + sum(db.payments.filter(p=>inRange(p.date,a,b)), p=>p.amount);
}
function earnedIn(a,b){ return sum(db.trips.filter(t=>inRange(t.date,a,b)), t=>t.fare); }

/* ---------- routing ---------- */
let view = 'today', openClientId = null, tripFilter = 'now', clientQuery = '';
function go(v){ view = v; openClientId = null; window.scrollTo(0,0); render(); }
function openClient(id){ openClientId = id; view = 'clients'; window.scrollTo(0,0); render(); }

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===view));
  document.getElementById('fab').classList.toggle('hidden', !(view==='today'||view==='trips'));
  const app = document.getElementById('app');
  if(openClientId) app.innerHTML = viewClient(openClientId);
  else if(view==='today') app.innerHTML = viewToday();
  else if(view==='trips') app.innerHTML = viewTrips();
  else if(view==='clients') app.innerHTML = viewClients();
  else app.innerHTML = viewMore();
}

/* ---------- today ---------- */
function viewToday(){
  const f = fortnight(), t = today();
  const days = [];
  for(let i=0;i<14;i++) days.push(iso(new Date(dt(f.start).getTime()+i*DAY)));
  const per = days.map(d=>earnedIn(d,d));
  const peak = Math.max(1, ...per);
  const bars = days.map((d,i)=>{
    const h = Math.round((per[i]/peak)*100);
    return `<span class="bar ${d===t?'today':''} ${d>t?'future':''}" title="${dayLabel(d)} ${K(per[i])}"><i style="height:${per[i]?Math.max(h,6):0}%"></i></span>`;
  }).join('');
  const dayNums = days.map(d=>`<span>${dt(d).getDate()}</span>`).join('');

  const todays = db.trips.filter(x=>x.date===t).sort((a,b)=>(b.time||'').localeCompare(a.time||''));
  const debtors = db.clients.map(c=>({c, b:balance(c.id)})).filter(x=>x.b>0.005).sort((a,b)=>b.b-a.b);

  return `
  <div class="top"><div class="wrap">
    <div class="top-row">
      <div>
        <div class="eyebrow">Uber and hire transport</div>
        <h1>Urban Links</h1>
      </div>
      <div style="text-align:right">
        <div class="eyebrow">Today</div>
        <div class="num" style="font-size:17px">${Kshort(earnedIn(t,t))}</div>
      </div>
    </div>
    <div class="pulse">
      <div class="pulse-head"><span class="eyebrow">This fortnight</span><span class="lbl">${rangeLabel(f)}</span></div>
      <div class="bars">${bars}</div>
      <div class="pulse-days">${dayNums}</div>
    </div>
  </div></div>

  <div class="wrap">
    <div class="tiles">
      <div class="tile got"><span class="eyebrow">Money in</span><span class="num v">${Kshort(receivedIn(f.start,f.end))}</span></div>
      <div class="tile owe"><span class="eyebrow">Owing now</span><span class="num v">${Kshort(totalOwing())}</span></div>
      <div class="tile wide"><span class="eyebrow">Fortnight billed</span><span class="num v" style="font-size:22px">${K(earnedIn(f.start,f.end))} <span style="font-size:13px;font-weight:500;color:var(--ink2)">over ${db.trips.filter(x=>inRange(x.date,f.start,f.end)).length} trips</span></span></div>
    </div>

    <section>
      <div class="sec-head"><span class="eyebrow">Today's trips</span>${todays.length?`<button class="link" onclick="go('trips')">See all</button>`:''}</div>
      ${todays.length ? `<div class="list">${todays.map(tripRow).join('')}</div>`
        : `<div class="empty"><b>No trips logged yet</b>Tap Trip to add the first run of the day.</div>`}
    </section>

    <section>
      <div class="sec-head"><span class="eyebrow">Who owes money</span>${debtors.length>4?`<button class="link" onclick="go('clients')">All ${debtors.length}</button>`:''}</div>
      ${debtors.length ? `<div class="list">${debtors.slice(0,4).map(x=>debtorRow(x.c,x.b)).join('')}</div>`
        : `<div class="empty"><b>Everyone is square</b>Nothing outstanding right now.</div>`}
    </section>
    <div style="height:70px"></div>
  </div>`;
}

function debtorRow(c,b){
  const f = fortnight();
  const paid = sum(paysOf(c.id).filter(p=>inRange(p.date,f.start,f.end)), p=>p.amount);
  const exp = Number(c.expected)||0;
  const pct = exp ? Math.min(100, Math.round(paid/exp*100)) : 0;
  return `<button class="row" onclick="openClient('${c.id}')">
    <span class="avatar due">${esc(initials(c.name))}</span>
    <span class="main">
      <span class="t1">${esc(c.name)}</span>
      <span class="t2">${exp ? `${K(paid)} of ${K(exp)} this fortnight` : 'Pays when able'}</span>
      ${exp?`<span class="prog"><i style="width:${pct}%"></i></span>`:''}
    </span>
    <span class="num amt due">${Kshort(b)}</span>
  </button>`;
}

/* ---------- trips ---------- */
function tripRow(t){
  const c = client(t.clientId);
  const route = [t.pickup, t.dropoff].filter(Boolean).join(' to ');
  return `<button class="row" onclick="openTrip('${t.id}')">
    <span class="avatar">${esc(initials(c?c.name:(t.clientName||'?')))}</span>
    <span class="main">
      <span class="t1">${esc(c?c.name:(t.clientName||'Cash fare'))}${t.time?` <span style="font-weight:400;color:var(--ink3);font-size:12px">${esc(t.time)}</span>`:''}</span>
      <span class="t2">${route ? esc(route) : (t.notes?esc(t.notes):'No route noted')}</span>
    </span>
    <span style="text-align:right">
      <span class="num amt ${t.settled?'ok':'due'}">${Kshort(t.fare)}</span>
      <span class="tag ${t.settled?'':'clay'}" style="margin-top:3px">${t.settled?'Paid':'On account'}</span>
    </span>
  </button>`;
}

function viewTrips(){
  const f = fortnight(), prev = fortnight(iso(new Date(dt(f.start).getTime()-DAY)));
  let list = db.trips.slice();
  if(tripFilter==='now') list = list.filter(t=>inRange(t.date,f.start,f.end));
  if(tripFilter==='prev') list = list.filter(t=>inRange(t.date,prev.start,prev.end));
  if(tripFilter==='due') list = list.filter(t=>!t.settled);
  list.sort((a,b)=> b.date.localeCompare(a.date) || (b.time||'').localeCompare(a.time||''));

  const groups = {};
  list.forEach(t=>{ (groups[t.date] ||= []).push(t); });
  const body = Object.keys(groups).map(d=>`
    <div class="date-head">${dayLabel(d)} <span style="float:right;color:var(--ink2)">${K(sum(groups[d],t=>t.fare))}</span></div>
    <div class="list">${groups[d].map(tripRow).join('')}</div>`).join('');

  return `
  <div class="top"><div class="wrap">
    <div class="eyebrow">Logbook</div><h1>Trips</h1>
    <div style="margin-top:12px;display:flex;gap:20px">
      <div><div class="eyebrow" style="color:#8C9A96">Showing</div><div class="num" style="font-size:19px">${K(sum(list,t=>t.fare))}</div></div>
      <div><div class="eyebrow" style="color:#8C9A96">Trips</div><div class="num" style="font-size:19px">${list.length}</div></div>
    </div>
  </div></div>
  <div class="wrap" style="padding-top:14px">
    <div class="chips">
      ${[['now','This fortnight'],['prev','Last fortnight'],['due','Unpaid'],['all','Everything']]
        .map(([k,l])=>`<button class="chip ${tripFilter===k?'on':''}" onclick="tripFilter='${k}';render()">${l}</button>`).join('')}
    </div>
    ${list.length ? body : `<div class="empty"><b>Nothing here</b>Try another filter, or log a trip.</div>`}
    <div style="height:80px"></div>
  </div>`;
}

/* ---------- sheet plumbing ---------- */
function openSheet(title, html){
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetBody').innerHTML = html;
  const sc = document.getElementById('scrim');
  sc.classList.remove('hidden'); requestAnimationFrame(()=>{ sc.classList.add('show'); document.getElementById('sheet').classList.add('show'); });
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('show');
  const sc = document.getElementById('scrim'); sc.classList.remove('show');
  setTimeout(()=>sc.classList.add('hidden'), 180);
}
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900); }
const val = id => (document.getElementById(id)||{}).value ?? '';

function paintSeg(){
  const a=document.getElementById('segPaid'), b=document.getElementById('segAcct');

function onTripClient(){
  const c = client(val('tClient'));
  if(c){ tripSettled = c.terms !== 'fortnight'; paintSeg(); }
}
function saveTrip(id){
  const fare = Number(val('tFare'));
  if(!(fare>=0) || val('tFare')===''){ toast('Enter the fare'); return; }
  if(!val('tDate')){ toast('Pick a date'); return; }
  const c = client(val('tClient'));
  const rec = { date:val('tDate'), time:val('tTime'), clientId:val('tClient')||null,
    clientName: c?c.name:'', pickup:val('tFrom').trim(), dropoff:val('tTo').trim(),
    fare, settled: val('tClient') ? tripSettled : true, notes:val('tNotes').trim() };
  if(id){ Object.assign(db.trips.find(x=>x.id===id), rec); }
  else { db.trips.push({ id:uid(), createdAt:Date.now(), ...rec }); }
  save(); closeSheet(); render(); toast(id?'Trip updated':'Trip logged');
}
function delTrip(id){
  if(!confirm('Delete this trip? This cannot be undone.')) return;
  db.trips = db.trips.filter(t=>t.id!==id); save(); closeSheet(); render(); toast('Trip deleted');
}

/* ---------- statement and receipt ---------- */
function letterhead(){
  const s = db.settings, out = [ (s.business||'Urban Links').toUpperCase() ];
  const c = [ s.phone?'Ph '+s.phone:'', s.email||'' ].filter(Boolean).join('  |  ');
  if(c) out.push(c);
  if(s.ipa) out.push('IPA Reg: '+s.ipa);
  if(s.address) out.push(s.address);
  return out;
}
function longDate(d){ return dt(d).toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'}); }
function shareText(text, phone){
  const digits = (phone||'').replace(/\D/g,'');
  const wa = digits ? 'https://wa.me/' + (digits.length===8 ? '675'+digits : digits.replace(/^0+/,'')) + '?text=' + encodeURIComponent(text) : null;
  if(navigator.share){ navigator.share({text}).catch(()=>{}); }
  else if(wa){ window.open(wa,'_blank'); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast('Copied, paste it to them')); }
  else { toast('Sharing is not available here'); }
}
function sendReceipt(payId){
  const p = db.payments.find(x=>x.id===payId); if(!p) return;
  const c = client(p.clientId), b = balance(p.clientId);
  const L = letterhead();
  L.push('', 'RECEIPT', longDate(p.date), '');
  L.push('Received from: ' + c.name);
  L.push('Amount: ' + K(p.amount));
  L.push('Method: ' + (p.method||'Cash'));
  if(p.note) L.push('Note: ' + p.note);
  L.push('');
  L.push(b>0.005 ? 'Balance still owing: ' + K(b) : 'Account now clear. Thank you.');
  shareText(L.join('\n'), c.phone);
}
function sendStatement(id){
  const c = client(id), b = balance(id);
  const unpaid = tripsOf(id).filter(t=>!t.settled).sort((a,b)=>a.date.localeCompare(b.date));
  const lines = letterhead();
  lines.push('', 'STATEMENT OF ACCOUNT', 'For: ' + c.name, 'As at ' + longDate(today()), '');
  if(unpaid.length){
    lines.push('Unpaid trips:');
    unpaid.forEach(t=>lines.push(`${shortDate(t.date)}  ${[t.pickup,t.dropoff].filter(Boolean).join(' to ')||'Trip'}  ${K(t.fare)}`));
    lines.push(`Trips total: ${K(sum(unpaid,t=>t.fare))}`);
  }
  const paid = sum(paysOf(id),p=>p.amount);
  if(paid) lines.push(`Payments received: ${K(paid)}`);
  lines.push('');
  lines.push(b>0.005 ? `BALANCE OWING: ${K(b)}` : 'BALANCE: all square, thank you');
  shareText(lines.join('\n'), c.phone);
}

/* ---------- backup and export ---------- */
function download(name, text, type){
  const blob = new Blob([text], {type:type||'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function stamp(){ return today().replace(/-/g,''); }
function backup(){ download(`urbanlinks-backup-${stamp()}.json`, JSON.stringify(db,null,2), 'application/json'); toast('Backup saved'); }
function restore(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d.clients || !d.trips) throw 0;
      if(!confirm('Replace everything on this phone with the backup?')) return;
      db = { settings:{business:'',anchor:today(), ...(d.settings||{})}, clients:d.clients||[], trips:d.trips||[], payments:d.payments||[] };
      save(); render(); toast('Backup restored');
    }catch(e){ toast('That file is not an Urban Links backup'); }
    input.value='';
  };
  r.readAsText(f);
}
const q = s => `"${String(s??'').replace(/"/g,'""')}"`;
function csvTrips(){
  const rows = [['Date','Time','Client','Pick up','Drop off','Fare','Status','Notes']];
  db.trips.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    const c = client(t.clientId);
    rows.push([t.date,t.time||'',c?c.name:(t.clientName||'Cash fare'),t.pickup,t.dropoff,t.fare,t.settled?'Paid':'On account',t.notes]);
  });
  download(`urbanlinks-trips-${stamp()}.csv`, rows.map(r=>r.map(q).join(',')).join('\n'), 'text/csv');
  toast('Trips exported');
}
function csvPayments(){
  const rows = [['Date','Client','Amount','Method','Note']];
  db.payments.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{
    const c = client(p.clientId);
    rows.push([p.date, c?c.name:'', p.amount, p.method, p.note]);
  });
  download(`urbanlinks-payments-${stamp()}.csv`, rows.map(r=>r.map(q).join(',')).join('\n'), 'text/csv');
  toast('Payments exported');
}
function wipe(){
  if(!confirm('Erase every trip, client and payment on this phone?')) return;
  if(!confirm('Last check. This cannot be undone. Save a backup first if you are unsure.')) return;
  db = blank(); save(); go('today'); toast('All data erased');
}

/* ---------- boot ---------- */
render();
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
